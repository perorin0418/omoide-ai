[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omoide-ai"
version = "0.1.4"
description = "Local-first AI memory engine for Copilot CLI and Claude Code."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "perorin0418" },
]
keywords = ["mcp", "copilot", "claude-code", "memory", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
dependencies = [
  "duckdb>=1.0.0",
  "ladybug>=0.0.1",
  "lancedb>=0.8.2",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/perorin0418/omoide-ai"
Repository = "https://github.com/perorin0418/omoide-ai"
Issues = "https://github.com/perorin0418/omoide-ai/issues"

[project.scripts]
omoide-ai = "ai_memory_engine.cli:main"
omoide-ai-mcp = "ai_memory_engine.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
