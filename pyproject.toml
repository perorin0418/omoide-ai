[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-memory-engine"
version = "0.1.0"
description = "Local-first AI memory engine for Copilot CLI and Claude Code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0.0",
  "kuzu>=0.7.1",
  "lancedb>=0.8.2",
  "PyYAML>=6.0",
]

[project.scripts]
ai-memory-engine = "ai_memory_engine.cli:main"
ai-memory-engine-mcp = "ai_memory_engine.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
